name: Update portfolio link

on:
  push:
    paths:
      - '.github/workflows/update-portfolio-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy portfolio URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'https://global.miguelcastro.works'
          new = 'https://miguelcastro.works'
          if old not in text:
              raise SystemExit('Legacy portfolio URL not found; refusing to make unrelated changes')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update portfolio URL"
          git push
